<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <defs>
    <linearGradient id="bdf_grad_main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="soft_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(6, 6)" filter="url(#soft_shadow)">
    <rect width="48" height="48" rx="12" fill="url(#bdf_grad_main)"/>
    <text x="24" y="23" text-anchor="middle" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="0.5">BDF</text>
    <text x="24" y="37" text-anchor="middle" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-weight="700" font-size="7" fill="#f59e0b" letter-spacing="1.2">FINANCE</text>
    <circle cx="9" cy="9" r="3" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(66, 0)">
    <text x="0" y="27" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-weight="700" font-size="17" fill="#0f172a" letter-spacing="-0.3">Bharat Digital</text>
    <text x="0" y="46" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#0284c7" letter-spacing="2.2">FINANCE</text>
  </g>
</svg>
